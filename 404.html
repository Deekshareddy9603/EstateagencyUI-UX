<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stackly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        *, *::before, *::after {
            box-sizing: inherit;
        }
    </style>
</head>
<body class="font-sans antialiased text-slate-900 bg-slate-50 selection:bg-slate-900 selection:text-white flex flex-col min-h-screen">

    <!-- Main 404 Content Section -->
    <main class="flex-grow flex items-center justify-center px-4 py-16">
        <div class="max-w-xl w-full text-center">
            
            <!-- Extra Bold 404 Title -->
            <h1 class="text-8xl sm:text-9xl font-black tracking-tight text-slate-900 mb-4">404</h1>
            
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-3">Oops! Page Not Found</h2>
            
            <p class="text-slate-600 text-base sm:text-lg mb-8 font-medium">
                The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>

            <!-- Action Buttons Container -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                
                <!-- Go Back Button -->
                <button onclick="history.back()" class="w-full sm:w-auto bg-white border border-slate-300 hover:bg-slate-100 text-slate-800 font-bold text-sm px-6 py-3 rounded-xl shadow-sm transition-all active:scale-95 flex items-center justify-center space-x-2">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    <span>Go Back</span>
                </button>

                <!-- Go Home Page Button -->
                <a href="./index.html" class="w-full sm:w-auto bg-[#081628] hover:bg-[#0c2340] text-white font-bold text-sm px-6 py-3 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center space-x-2">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    <span>Go Home Page</span>
                </a>

            </div>

        </div>
    </main>

</body>
</html>
